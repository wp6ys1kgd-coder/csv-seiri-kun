<!doctype html><html lang="ja"><meta charset="utf-8"><title>CSV結合くん</title><style>body{font-family:system-ui;max-width:700px;margin:50px auto;padding:20px}.box{border:1px solid #ddd;border-radius:12px;padding:25px}button{padding:10px 18px;background:#2257d6;color:#fff;border:0;border-radius:7px}</style><div class="box"><h1>CSV結合くん</h1><p>同じ列構成のCSVを複数選び、1つのCSVに結合します。</p><input id="f" type="file" accept=".csv" multiple><p><button id="go" disabled>結合して保存</button></p><p id="s"></p></div><script>const f=document.querySelector('#f'),go=document.querySelector('#go'),s=document.querySelector('#s');f.onchange=()=>go.disabled=f.files.length<2;go.onclick=async()=>{const files=[...f.files],texts=await Promise.all(files.map(x=>x.text())),rows=texts.map(t=>t.replace(/^\uFEFF/,'').trim().split(/\r?\n/));const head=rows[0][0],body=rows.flatMap((r,i)=>i?r.slice(1):r.slice(1));const blob=new Blob(['\uFEFF',[head,...body].join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='結合結果.csv';a.click();s.textContent=`${files.length}ファイルを結合しました。`}</script>
