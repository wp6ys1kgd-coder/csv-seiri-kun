<!doctype html><html lang="ja"><meta charset="utf-8"><title>設定</title><style>body{font-family:system-ui;max-width:650px;margin:50px auto;padding:20px}.box{border:1px solid #ddd;border-radius:12px;padding:25px}button{padding:10px 16px;border:0;border-radius:7px;background:#64748b;color:#fff;margin-right:8px}.danger{background:#b42318}</style><div class="box"><h1>設定</h1><p>このブラウザに保存されている申し送りデータを管理します。</p><p id="count"></p><button id="reload">件数を更新</button><button id="clear" class="danger">全データを消去</button><p id="msg"></p></div><script>const c=document.querySelector('#count'),m=document.querySelector('#msg');function show(){let d=JSON.parse(localStorage.getItem('store-handoff-v1')||'[]');c.textContent=`保存件数：${d.length}件`}reload.onclick=show;clear.onclick=()=>{if(confirm('保存データをすべて消去します。この操作は戻せません。')){localStorage.removeItem('store-handoff-v1');m.textContent='データを消去しました。';show()}};show()</script>
