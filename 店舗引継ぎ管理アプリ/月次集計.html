<!doctype html><html lang="ja"><meta charset="utf-8"><title>月次集計</title><style>body{font-family:system-ui;max-width:850px;margin:40px auto;padding:20px}table{border-collapse:collapse;width:100%;margin:12px 0 25px}td,th{border:1px solid #ddd;padding:9px;text-align:left}.card{display:inline-block;border:1px solid #ddd;border-radius:10px;padding:16px;margin:5px;font-size:18px}</style><h1>申し送り 月次集計</h1><label>対象月 <input id="m" type="month"></label><div id="out"></div><script>const d=JSON.parse(localStorage.getItem('store-handoff-v1')||'[]'),m=document.querySelector('#m'),o=document.querySelector('#out');m.value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date()).slice(0,7);const esc=x=>String(x||'').replaceAll('&','&amp;').replaceAll('<','&lt;');function f(){const r=d.filter(x=>x.date.startsWith(m.value)),g=k=>Object.entries(r.reduce((a,x)=>(a[x[k]||'未設定']=(a[x[k]||'未設定']||0)+1,a),{}));const t=(title,a)=>`<h2>${title}</h2><table><tr><th>項目</th><th>件数</th></tr>${a.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table>`;o.innerHTML=`<div class="card">登録 ${r.length}件</div><div class="card">完了 ${r.filter(x=>x.status==='完了').length}件</div><div class="card">未完了 ${r.filter(x=>x.status!=='完了').length}件</div><div class="card">期限超過 ${r.filter(x=>x.due&&x.due<new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date())&&x.status!=='完了').length}件</div>`+t('分類別',g('cat'))+t('重要度別',g('priority'))+t('担当者別',g('person'))}m.onchange=f;f()</script>
<p><a href="index.html">メイン画面へ戻る</a></p>
