<!doctype html><html lang="ja"><meta charset="utf-8"><title>月次集計</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:10px;text-align:left}.card{display:inline-block;border:1px solid #ddd;border-radius:10px;padding:18px;margin:6px;font-size:18px}</style><h1>申し送り 月次集計</h1><label>対象月 <input id="m" type="month"></label><div id="out"></div><script>const d=JSON.parse(localStorage.getItem('store-handoff-v1')||'[]'),m=document.querySelector('#m'),o=document.querySelector('#out');m.value=new Date().toISOString().slice(0,7);function f(){const r=d.filter(x=>x.date.startsWith(m.value)),g=k=>Object.entries(r.reduce((a,x)=>(a[x[k]]=(a[x[k]]||0)+1,a),{}));o.innerHTML=`<div class="card">登録 ${r.length}件</div><div class="card">完了 ${r.filter(x=>x.status==='完了').length}件</div><div class="card">未完了 ${r.filter(x=>x.status!=='完了').length}件</div><h2>分類別</h2><table><tr><th>分類</th><th>件数</th></tr>${g('cat').map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`}m.onchange=f;f()</script>
