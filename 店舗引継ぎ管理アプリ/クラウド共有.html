<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クラウド共有</title><style>body{font-family:system-ui,"Yu Gothic";max-width:760px;margin:30px auto;padding:20px;background:#f4f7fb}.box{background:#fff;padding:24px;border-radius:12px}label{display:grid;gap:5px;margin:12px 0}input,select,button{padding:10px;font:inherit}button{background:#2369d1;color:#fff;border:0;border-radius:6px;margin:4px}.danger{background:#a83245}#msg{white-space:pre-wrap}</style><div class="box"><h1>店舗引継ぎ管理｜クラウド共有</h1><p>SharePoint／Power Automate、Firebase、Supabase、その他REST APIのJSONエンドポイントに接続します。</p><label>接続先<select id="provider"><option>SharePoint／Power Automate</option><option>Firebase</option><option>Supabase</option><option>汎用REST API</option></select></label><label>接続先URL<input id="url" placeholder="https://example.com/api/data"></label><label>アクセストークン<input id="token" type="password"></label><label>保存メソッド<select id="method"><option>POST</option><option>PUT</option></select></label><div><button id="save">クラウドへ保存</button><button id="load">クラウドから読込</button><button class="danger" id="clear">設定を消去</button></div><p id="last">最終同期：未実行</p><p id="msg"></p><p><a href="index.html">メインアプリへ戻る</a></p></div><script>const KEY='store-handoff-v1',CFG='store-cloud-config-v1',url=document.querySelector('#url'),token=document.querySelector('#token'),method=document.querySelector('#method'),provider=document.querySelector('#provider'),last=document.querySelector('#last'),msg=document.querySelector('#msg');const cfg=JSON.parse(localStorage.getItem(CFG)||'null')||{};url.value=cfg.url||'';token.value=cfg.token||'';method.value=cfg.method||'POST';provider.value=cfg.provider||provider.value;const stamp=localStorage.getItem(CFG+'-last');if(stamp)last.textContent='最終同期：'+stamp;function headers(){return{'Content-Type':'application/json',...(token.value?{'Authorization':'Bearer '+token.value}:{})}}function config(){localStorage.setItem(CFG,JSON.stringify({url:url.value,token:token.value,method:method.value,provider:provider.value}));}save.onclick=async()=>{if(!url.value)return msg.textContent='接続先URLを入力してください。';config();try{const r=await fetch(url.value,{method:method.value,headers:headers(),body:JSON.stringify({data:JSON.parse(localStorage.getItem(KEY)||'[]'),updatedAt:new Date().toISOString()})});if(!r.ok)throw Error(r.status+' '+r.statusText);const t=new Date().toLocaleString('ja-JP');localStorage.setItem(CFG+'-last',t);last.textContent='最終同期：'+t;msg.textContent='クラウドへ保存しました。';}catch(e){msg.textContent='保存に失敗：'+e.message}};load.onclick=async()=>{if(!url.value)return msg.textContent='接続先URLを入力してください。';config();try{const r=await fetch(url.value,{headers:headers()});if(!r.ok)throw Error(r.status+' '+r.statusText);const j=await r.json(),d=Array.isArray(j)?j:(j.data||j.items);if(!Array.isArray(d))throw Error('data配列が見つかりません');if(!confirm('現在のローカルデータをクラウドの内容で置き換えますか？'))return;localStorage.setItem(KEY,JSON.stringify(d));const t=new Date().toLocaleString('ja-JP');localStorage.setItem(CFG+'-last',t);last.textContent='最終同期：'+t;msg.textContent=d.length+'件を読み込みました。メインアプリを再読み込みしてください。';}catch(e){msg.textContent='読込に失敗：'+e.message}};clear.onclick=()=>{localStorage.removeItem(CFG);url.value='';token.value='';msg.textContent='接続設定を消去しました。'};</script>
<script src="js/data_safety.js"></script><script src="js/cloud_safe.js"></script>
