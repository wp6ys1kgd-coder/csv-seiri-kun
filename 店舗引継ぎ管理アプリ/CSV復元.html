<!doctype html><html lang="ja"><meta charset="utf-8"><title>CSV復元</title><style>body{font-family:system-ui;max-width:700px;margin:50px auto;padding:20px}.box{border:1px solid #ddd;border-radius:12px;padding:24px}button{padding:10px 18px;background:#2257d6;color:#fff;border:0;border-radius:7px}</style><div class="box"><h1>申し送りCSV復元</h1><p>バックアップしたCSVを選ぶと、確認後に保存データを置き換えます。</p><input id="f" type="file" accept=".csv"><button id="go" disabled>確認して復元</button><p id="s"></p></div><script>const f=document.querySelector('#f'),go=document.querySelector('#go'),s=document.querySelector('#s');f.onchange=()=>go.disabled=!f.files[0];function parse(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);a.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);a.push(r)}return a}go.onclick=async()=>{if(!confirm('現在のデータを置き換えますか？'))return;const rows=parse((await f.files[0].text()).replace(/^\uFEFF/,'')),d=rows.slice(1).filter(r=>r.length>=11&&r.some(Boolean)).map((r,i)=>({id:crypto.randomUUID(),no:r[0]||`MSG-${String(i+1).padStart(4,'0')}`,created:new Date().toISOString(),date:r[1],subject:r[2],cat:r[3],priority:r[4],person:r[5],due:r[6],status:r[7]||'未対応',content:r[8],response:r[9],improve:r[10],completed:''}));localStorage.setItem('store-handoff-v1',JSON.stringify(d));s.textContent=`${d.length}件を復元しました。メイン画面を再読み込みしてください。`}</script>
