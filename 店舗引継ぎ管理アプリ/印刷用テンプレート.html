<!doctype html><html lang="ja"><meta charset="utf-8"><title>申し送り印刷用</title><style>body{font-family:"Yu Gothic",sans-serif;margin:24mm;color:#111}h1{font-size:22px;border-bottom:2px solid #222;padding-bottom:8px}.row{display:flex;border-bottom:1px solid #ccc;padding:9px 0}.label{width:120px;font-weight:700}.value{white-space:pre-wrap;flex:1}.actions{display:flex;gap:8px;margin-top:20px}button,a{padding:10px 18px}@media print{.actions{display:none}}</style><h1>申し送り詳細</h1><div id="out"></div><div class="actions"><a href="index.html">メイン画面へ戻る</a><button id="printBtn">印刷</button></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const all=JSON.parse(localStorage.getItem('store-handoff-v1')||'[]'),id=new URLSearchParams(location.search).get('id'),d=id?all.find(x=>x.id===id):null,fields=[['管理番号','no'],['発生日','date'],['件名','subject'],['分類','cat'],['重要度','priority'],['担当者','person'],['対応期限','due'],['対応状況','status'],['内容','content'],['対応内容','response'],['改善策','improve'],['完了日時','completed']];document.querySelector('#out').innerHTML=d?fields.map(x=>`<div class="row"><div class="label">${x[0]}</div><div class="value">${esc(d[x[1]])}</div></div>`).join(''):'印刷する案件が選択されていません。メイン画面の案件詳細から「この案件を印刷」を押してください。';printBtn.disabled=!d;printBtn.onclick=()=>print();</script>
