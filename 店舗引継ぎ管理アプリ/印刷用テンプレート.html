<!doctype html><html lang="ja"><meta charset="utf-8"><title>申し送り印刷用</title><style>body{font-family:"Yu Gothic",sans-serif;margin:24mm;color:#111}h1{font-size:22px;border-bottom:2px solid #222;padding-bottom:8px}.row{display:flex;border-bottom:1px solid #ccc;padding:9px 0}.label{width:120px;font-weight:700}.value{white-space:pre-wrap;flex:1}button{margin-top:20px;padding:10px 18px}@media print{button{display:none}}</style><h1>申し送り詳細</h1><div id="out"></div><button onclick="print()">印刷</button><script>const all=JSON.parse(localStorage.getItem('store-handoff-v1')||'[]'),id=new URLSearchParams(location.search).get('id'),d=all.find(x=>x.id===id)||all[0],fields=[['管理番号','no'],['発生日','date'],['件名','subject'],['分類','cat'],['重要度','priority'],['担当者','person'],['対応期限','due'],['対応状況','status'],['内容','content'],['対応内容','response'],['改善策','improve'],['完了日時','completed']];document.querySelector('#out').innerHTML=d?fields.map(x=>`<div class="row"><div class="label">${x[0]}</div><div class="value">${String(d[x[1]]||'')}</div></div>`).join(''):'データがありません。' </script>
