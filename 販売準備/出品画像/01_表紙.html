<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1220, initial-scale=1">
<title>CSV整理くん 表紙</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1220px;height:1016px;overflow:hidden;font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#132d43}body{background:#eaf1f7}.canvas{position:relative;width:100%;height:100%;padding:80px 86px;background:radial-gradient(circle at 82% 14%,rgba(61,174,255,.34),transparent 28%),linear-gradient(145deg,#f8fbfd 0%,#e5f0f8 56%,#dcebf7 100%)}.canvas:after{content:"";position:absolute;right:-100px;bottom:-150px;width:530px;height:530px;border:90px solid rgba(11,101,194,.07);border-radius:50%}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:17px;font-size:30px;font-weight:800}.mark{display:grid;place-items:center;width:62px;height:62px;background:#0b65c2;border-radius:18px;box-shadow:0 12px 30px rgba(11,101,194,.24)}.mark svg{width:35px;color:white}.badge{padding:12px 22px;border:2px solid #8ec8a8;border-radius:999px;background:#eaf8ef;color:#17603a;font-size:22px;font-weight:750}.content{display:grid;grid-template-columns:1.08fr .92fr;gap:60px;align-items:center;margin-top:86px}.eyebrow{display:inline-block;color:#0b65c2;font-size:24px;font-weight:800;letter-spacing:.08em;margin-bottom:20px}.headline{margin:0;font-size:72px;line-height:1.17;letter-spacing:.01em}.headline strong{color:#0b65c2}.lead{font-size:29px;line-height:1.6;color:#4d6476;margin:34px 0}.chips{display:flex;flex-wrap:wrap;gap:14px}.chip{padding:13px 20px;background:white;border:1px solid #cbdbe7;border-radius:12px;font-size:22px;font-weight:750;box-shadow:0 8px 22px rgba(41,77,107,.08)}.window{position:relative;background:white;border:1px solid #cad9e5;border-radius:24px;box-shadow:0 28px 70px rgba(37,69,95,.18);padding:26px;transform:rotate(1.2deg)}.bar{display:flex;gap:9px;margin-bottom:24px}.dot{width:13px;height:13px;border-radius:50%;background:#ccd7df}.mini-brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:800;margin-bottom:25px}.mini-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#0b65c2;color:white}.drop{border:3px dashed #9eb7cb;border-radius:18px;background:#f7fafc;text-align:center;padding:40px 20px}.upload{font-size:45px;color:#0b65c2}.drop b{display:block;font-size:22px;margin:12px 0 7px}.drop span{font-size:17px;color:#65788a}.button{display:inline-block;margin-top:20px;background:#0b65c2;color:white;border-radius:11px;padding:13px 25px;font-size:18px;font-weight:750}.secure{display:flex;align-items:center;gap:9px;margin-top:24px;padding:14px 16px;border-radius:12px;background:#e8f7ee;color:#195b36;font-size:17px;font-weight:700}.footer{position:absolute;left:86px;right:86px;bottom:58px;display:flex;justify-content:space-between;align-items:center;color:#5e7385;font-size:19px}.footer strong{color:#173f60}.noinstall{font-weight:800;color:#0b65c2}
</style>
</head>
<body><main class="canvas">
  <div class="top"><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM8 4v16M4 9h16M4 14h16"/></svg></span>CSV整理くん</div><div class="badge">CSVは外部送信なし</div></div>
  <section class="content">
    <div><span class="eyebrow">毎週の繰り返し作業を</span><h1 class="headline"><strong>1クリック</strong>で<br>すっきり整理</h1><p class="lead">空行・重複データ・余分な空白をまとめて整理。指定した列で並べ替えます。</p><div class="chips"><span class="chip">空行削除</span><span class="chip">重複削除</span><span class="chip">並べ替え</span></div></div>
    <div class="window"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="mini-brand"><span class="mini-icon">表</span>CSV整理くん</div><div class="drop"><div class="upload">⇧</div><b>CSVファイルをここへ</b><span>またはボタンから選択</span><div class="button">CSVを選ぶ</div></div><div class="secure">✓　データはブラウザー内だけで処理</div></div>
  </section>
  <footer class="footer"><span><strong>Chrome・Edge対応</strong>　初心者向け操作画面</span><span class="noinstall">インストール不要</span></footer>
</main></body></html>
